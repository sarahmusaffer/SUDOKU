<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sudoku</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="light-mode">
    <img src="images/moon.png" alt="moon" id="themeIcon">
    <div class="home-screen">
        <img src="images/grid.png" alt="Sudoku logo" class="logo">
        <h1 id="title"> Sudoku </h1>
        <div class="difficulty">

            <select id="difficulty">
                <option value="" selected disabled hidden>Select Difficulty </option>
                <option value="Easy"> Easy </option>
                <option value="Medium"> Medium</option>
                <option value="Hard"> Hard </option>
                <option value="Expert"> Expert </option>
                <option value="Master"> Master </option>
                <option value="Extreme"> Extreme </option>
            </select>
            <div id="messageBox">
                <p id="message"> </p>
            </div>
        </div>
        <button id="newGameBtn">New Game </button>
        <button id="continueGameBtn" class="secondary"> Continue Game</button>

    </div>
    <script src="js/script.js"></script>
</body>
</html>
